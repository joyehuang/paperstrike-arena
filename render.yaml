services:
  - type: web
    name: paperstrike-pvp
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    buildCommand: npm ci --include=dev
    startCommand: npm run pvp:server
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: ALLOWED_ORIGINS
        value: https://joyehuang.app,https://paperstrike-arena.vercel.app
